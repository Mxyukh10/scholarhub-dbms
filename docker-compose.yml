services:
  db:
    image: pgvector/pgvector:pg16
    container_name: scholarhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scholarhub
      POSTGRES_USER: scholarhub
      POSTGRES_PASSWORD: scholarhub_local_pw
    ports:
      - "5432:5432"
    volumes:
      - scholarhub_pgdata:/var/lib/postgresql/data
      - ./db/scholarhub_schema.sql:/docker-entrypoint-initdb.d/01-scholarhub.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarhub -d scholarhub"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  scholarhub_pgdata:
